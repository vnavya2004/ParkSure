name: parking
description: Your parking partner

publish_to: 'none' # Keeps the project private.

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0" # Update to match your Dart SDK.

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1 # Updated for null safety
  firebase_auth: ^5.4.1 # Updated for null safety
  google_maps_flutter: ^2.2.0 # Updated for null safety
  flutter_native_splash: ^2.0.4
  geolocator: ^13.0.2 # Updated for null safety
  google_sign_in: ^6.0.0
  qr_flutter: ^4.0.0
  cloud_firestore: ^5.6.2 # Updated for null safety
  razorpay_flutter: ^1.2.8
  fluttertoast: ^8.2.1
  carousel_slider: ^5.0.0
  twilio_flutter: ^0.9.0 # Add the latest version or compatible one
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#ffffff"  # Background color of the splash screen
  image: assets/images/parkmeIcon.png  # Path to your splash screen image
  android: true  # Enable for Android
  ios: true  # Enable for iOS
  web: true  # Enable for web (if needed)
  android_gravity: center # Center the logo
  ios_content_mode: scaleAspectFit # Fit the logo to the screen
  fullscreen: true # Use fullscreen splash

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/parkmeIcon.png"

flutter_launcher_name:
  name: "Park ME"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

